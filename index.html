<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Plantgezondheid</title>
  <meta name="description" content="Analyseer de gezondheid van je planten met AI" />

  <meta name="theme-color" content="#2f6b4f" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121b16" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Planten" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Ionic component library (zelf gehost — geen build-stap, geen CDN-afhankelijkheid) -->
  <link rel="stylesheet" href="vendor/ionic/css/ionic.bundle.css" />
  <link rel="stylesheet" href="vendor/ionic/css/palettes/dark.system.css" />
  <script type="module" src="vendor/ionic/ionic.esm.js"></script>

  <link rel="stylesheet" href="css/theme.css" />
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <ion-app>
    <!-- Views renderen in deze div; overlays (modals) verhuizen naar ion-app zelf en blijven zo staan -->
    <div id="app">
      <div class="boot-splash">
        <img class="boot-logo" src="icons/icon-192.png" alt="" width="72" height="72" />
      </div>
    </div>
  </ion-app>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
